replicaCount: 1

image:
  repository: ghcr.io/example/application-one
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: application-one.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

environment:
  SPRING_PROFILES_ACTIVE: dev
  APP_VERSION: "1.0.0"

features:
  notification: false
  fraudCheck: false
  databaseChange: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
