apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application-one.fullname" . }}-config
data:
  APP_VERSION: {{ .Values.environment.APP_VERSION | quote }}
  SPRING_PROFILES_ACTIVE: {{ .Values.environment.SPRING_PROFILES_ACTIVE | quote }}
  NOTIFICATION_ENABLED: {{ .Values.features.notification | quote }}
  FRAUD_CHECK_ENABLED: {{ .Values.features.fraudCheck | quote }}
  DATABASE_CHANGE: {{ .Values.features.databaseChange | quote }}
